<!doctype html>
<!--
  Source for public/og-image.png (1200x630). Regenerate with:
    npm run og
  Uses the shipped font files so the card matches the site exactly.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Fraunces Variable';
        src: url('/fonts/fraunces-latin-soft-normal.woff2') format('woff2-variations');
        font-weight: 100 900;
      }
      @font-face {
        font-family: 'IBM Plex Sans';
        src: url('/fonts/ibm-plex-sans-latin-wght-normal.woff2') format('woff2-variations');
        font-weight: 100 700;
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        src: url('/fonts/ibm-plex-mono-latin-400-normal.woff2') format('woff2');
        font-weight: 400;
      }

      * { box-sizing: border-box; }

      html, body { margin: 0; padding: 0; }

      body {
        width: 1200px;
        height: 630px;
        background: #16365a;
        color: #f4f0e6;
        padding: 84px 96px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        font-family: 'IBM Plex Sans', sans-serif;
      }

      .mark { color: #f4f0e6; }

      .statement {
        font-family: 'Fraunces Variable', serif;
        font-weight: 500;
        font-variation-settings: 'SOFT' 30;
        font-size: 64px;
        line-height: 1.08;
        letter-spacing: -0.03em;
        max-width: 19ch;
        margin: 0;
      }

      .foot {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
      }

      .wordmark {
        font-family: 'Fraunces Variable', serif;
        font-weight: 500;
        font-variation-settings: 'SOFT' 30;
        font-size: 44px;
        letter-spacing: -0.03em;
        line-height: 1;
      }

      .tagline {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 19px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: #93bfcc;
        margin-top: 14px;
      }

      .domain {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 19px;
        letter-spacing: 0.1em;
        color: #93bfcc;
      }
    </style>
  </head>
  <body>
    <svg
      class="mark"
      width="56"
      height="56"
      viewBox="0 0 32 32"
      fill="none"
      stroke="currentColor"
      stroke-width="3.5"
      stroke-linecap="butt"
      stroke-linejoin="miter"
    >
      <path d="M3 8 H13 L21 16 H29" />
      <path d="M3 24 H13 L21 16" />
    </svg>

    <p class="statement">New 510(k), or Letter-to-File? Cited, in minutes.</p>

    <div class="foot">
      <div>
        <div class="wordmark">Galen</div>
        <div class="tagline">Regulatory infrastructure</div>
      </div>
      <div class="domain">galen.software</div>
    </div>
  </body>
</html>
